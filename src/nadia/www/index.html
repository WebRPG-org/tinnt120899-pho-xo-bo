<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- Màn dọc 9:16, không cho zoom tay (game mobile dọc như Nadia web). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Phố Xô Bồ</title>
  <!--
    Thứ tự load theo core RPG Maker MV v1.6.1 (docs/architecture-nadia.md §1.2).
    Core MV v1.6.1 (MIT) ĐÃ CÓ trong repo từ 19/11/2026 ~00:05 (nhóm T15):
    js/rpg_*.js + js/libs/* lấy từ rpgtkoolmv/corescript tag community 1.3b
    (header mỗi file ghi "v1.6.1 (community-1.3b)"), build bằng concat.js
    của repo, pixi v4.5.4 từ bundle MV. Chỉ lấy code core + libs MIT.
    Mở trình duyệt lúc này vẫn chưa chơi được: PXB_Isometric chưa móc
    Tilemap, tile data toàn 0, img/audio trống — xem src/nadia/README.md.
    KHÔNG mở file:// trực tiếp — phải qua web server (python3 -m http.server),
    trình duyệt chặn load data file từ ổ đĩa (xem docs/architecture-nadia.md §1.7).
  -->
  <script type="text/javascript" src="js/libs/pixi.js"></script>
  <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
  <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
  <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
  <script type="text/javascript" src="js/libs/lz-string.js"></script>
  <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
  <script type="text/javascript" src="js/rpg_core.js"></script>
  <script type="text/javascript" src="js/rpg_managers.js"></script>
  <script type="text/javascript" src="js/rpg_objects.js"></script>
  <script type="text/javascript" src="js/rpg_scenes.js"></script>
  <script type="text/javascript" src="js/rpg_sprites.js"></script>
  <script type="text/javascript" src="js/rpg_windows.js"></script>
  <!-- Asset nhúng base64 (atlas PNG + ảnh hệ thống placeholder): phải load
       TRƯỚC plugins và main để hook ImageManager kịp trước Scene_Boot.
       Sinh bằng tools/tiles/embed_assets.py — xem docs/link-choi-that.md. -->
  <script type="text/javascript" src="js/pxb-embedded.js"></script>
  <script type="text/javascript" src="js/plugins.js"></script>
  <script type="text/javascript" src="js/main.js"></script>
  <style>
    body { margin: 0; background: #F9EDCE; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font-family: sans-serif; color: #8a5a2b;
    }
  </style>
</head>
<body>
  <!-- Hiện cho tới khi Scene_Boot vẽ canvas (MV thay bằng canvas của game). -->
